name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'persons/**'
      - 'reference/**'
      - 'concordances/**'
      - 'ontology.ttl'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # working-directory points lockfile auto-detection (and the action's
      # built-in `vp install`) at site/, where the project actually lives.
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          working-directory: site

      - name: Build static site
        run: cd site && vp build

      - name: Normalize sitemap URLs
        run: cd site && node scripts/normalize-sitemap.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
